schema = "nautilus-buoy-pin/v1"

[buoy]
repository = "git@github.com:Chelis-Lang/buoy.git"
revision = "a88fd2efce0f2aef20538abdc7f265696600e408"
consumer_package = "nix/consumer-package-v1.nix"
declared_source = "nix/tools/declared-source.nix"
reviewed_source_content_hash = "sha256-WpJKnGKo8+40wwSisLKH0c+g2TrXY+5VVuyfWR/X4hk="
reviewed_source_note = "Nautilus-reviewed content hash of the declared source filter applied to the clean fetched tree at the pinned revision. The upstream committed constant covers a development worktree that carries ambient devenv files, so it does not hold for a clean checkout; an upstream follow-up is recorded in the trust-boundary document."
digest_feature = "blake3-256"
provenance_command = "chelis-provenance"
provenance_command_source = "upstream consumer package (nix/buoy-consumer.nix); the pinned revision builds the buoy and chelis-provenance binaries with exact per-package digest features"

[chelis]
version = "0.18.6"
version_skew = "the pinned adapter parses saved Surf sources with the vendored tree-sitter grammar from Chelis v0.18.5 (fc3232ff), which matches this repository's compiler pin; item identities were reingested under chelis-surf-syntax/v2 from parsed declaration node bytes, and a source outside the canonical Surf surface fails the static check with CHELIS-PROV-PARSE-ERROR"

[policy]
enforcement = "advisory"
floating_references = "forbidden; the revision must be one full 40-hex commit"
vendoring = "forbidden; Buoy resolves only through the pinned consumer package"
