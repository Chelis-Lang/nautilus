schema = "chelis-adapter-config/v1"
binding-store = "provenance/bindings"

[[selector]]
root = "src"
dialect = "surf"

[[selector]]
root = "tests"
dialect = "surf"

[[selector]]
root = "tests_neg"
dialect = "surf"

# Selected for content-addressed objects only. No Surf sources live here.
[[selector]]
root = "provenance/bindings"
dialect = "surf"

# Selected for its raw artifacts only: the CI workflow that installs and
# invokes the gate runner. No Surf sources live here.
[[selector]]
root = ".github"
dialect = "surf"
