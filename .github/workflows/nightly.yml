name: nightly

# The legacy Python harness is the dual-run safety net while the new
# `chelis test tests/` + `parity/run_parity.py` gates accumulate
# confidence. It runs on a schedule (daily at 06:00 UTC) and on demand,
# but NOT on every PR — its 9-min wall-clock would dominate the PR
# gate. Once the new gates have full coverage parity (Phase 4 of the
# cutover plan), this whole workflow is deleted along with
# `tests_legacy/` itself.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

env:
  CHELIS_TAG: v0.7.26
  CHELIS_VERSION: 0.7.26

jobs:
  legacy-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies (openblas for emitted BLAS calls)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download "$CHELIS_TAG" \
            --repo Chelis-Lang/chelis \
            --pattern "chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            --dir /tmp/chelis-toolchain
          tar -xzf "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: test "$(chelis --version)" = "chelis ${CHELIS_VERSION}"

      - name: Install chelis-std into local registry
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          CHELIS_TAG: ${{ env.CHELIS_TAG }}
        run: python3 scripts/install_chelis_std.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      # Per-file chelis check with score=1 enforcement. Removed from
      # the PR gate (ci.yml) because each invocation costs ~25s on a
      # GitHub Actions runner (1000× slower than local). 21 files ×
      # 25s = ~9 min — fine for a nightly job, unacceptable on PRs.
      # The PR gate has chelis reef build (whole-package type check)
      # plus a one-file rotating chelis check smoke; this is the
      # comprehensive pass.
      - name: chelis check (all modules, score=1 enforced)
        run: |
          for f in src/*.ch; do
            echo "=== $f ==="
            out=$(chelis check "$f")
            echo "$out"
            echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"
          done

      - name: Static API cross-checks (legacy)
        run: python3 tests_legacy/run_static_checks.py

      - name: Goldens drift check (scipy parity, legacy)
        run: python3 scripts/gen_goldens.py --check

      - name: End-to-end numerical tests (legacy harness)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_numeric_tests.py

      - name: Validate SKILL.md examples (legacy)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_skill_checks.py

      - name: Validate mdBook examples
        env:
          CHELIS_BIN: chelis
        run: python3 scripts/validate_book_examples.py
