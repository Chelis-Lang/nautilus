name: nightly

# Slimmed nightly: the per-PR ci.yml already runs `chelis test tests/`
# (the native roots/optim/etc suite) and a strict `parity/run_parity.py`
# job against reviewed, checked-in SciPy goldens. Golden regeneration is an
# explicit local operation and never runs in CI. What remains is the
# nightly's unique value, none of which fits the PR latency budget:
#   * the exhaustive per-file `chelis check` score=1 sweep over all
#     src/*.ch (~9 min — too slow for the PR gate, which runs a whole
#     -package `chelis reef build` plus a one-file rotating smoke), and
#   * SKILL.md + mdBook example validation (compile every documented
#     ```chelis block at score 1 against the pinned toolchain).
# Runs on a schedule (daily at 06:00 UTC) and on demand, NOT per-PR.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # Audit-only mirror required by the shell contract. Runtime installation
  # resolves the exact compiler pin directly from reef.toml.
  CHELIS_TAG: v0.18.2
  CHELIS_VERSION: 0.18.2

jobs:
  documentation-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert workflow Chelis audit mirrors match reef.toml
        run: python3 scripts/check_workflow_pins.py

      - name: Install C dependencies (openblas for emitted BLAS calls)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      # Per-file chelis check with score=1 enforcement. Removed from
      # the PR gate (ci.yml) because each invocation costs ~25s on a
      # GitHub Actions runner (1000× slower than local). 21 files ×
      # 25s = ~9 min — fine for a nightly job, unacceptable on PRs.
      # The PR gate has chelis reef build (whole-package type check)
      # plus a one-file rotating chelis check smoke; this is the
      # comprehensive pass.
      - name: chelis check (all modules, score=1 enforced)
        run: |
          for f in src/*.ch; do
            echo "=== $f ==="
            out=$(chelis check "$f")
            echo "$out"
            echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"
          done

      - name: Validate SKILL.md examples
        env:
          CHELIS_BIN: chelis
        run: python3 scripts/validate_skill_examples.py

      - name: Validate mdBook examples
        env:
          CHELIS_BIN: chelis
        run: python3 scripts/validate_book_examples.py

  # Surface a nightly failure as a tracking issue (opens on failure, closes on
  # green) so a red nightly is impossible to miss — scheduled-run failures do
  # not show a red status on main, which is how this nightly stayed red for
  # weeks unnoticed (nautilus#11).
  report:
    name: Surface nightly status
    needs: documentation-gates
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close nightly-failure tracking issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.documentation-gates.result }}
        with:
          script: |
            const title = 'Nightly failing: nautilus';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (process.env.RESULT === 'failure') {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **nautilus** nightly failed.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the nightly next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (process.env.RESULT === 'success' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
