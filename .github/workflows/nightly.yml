name: nightly

# The legacy Python harness is the dual-run safety net while the new
# `chelis test tests/` + `parity/run_parity.py` gates accumulate
# confidence. It runs on a schedule (daily at 06:00 UTC) and on demand,
# but NOT on every PR — its 9-min wall-clock would dominate the PR
# gate. Once the new gates have full coverage parity (Phase 4 of the
# cutover plan), this whole workflow is deleted along with
# `tests_legacy/` itself.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  legacy-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.7 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.7-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.7-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.7-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install chelis-std into local registry
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: scripts/install_chelis_std.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      - name: Static API cross-checks (legacy)
        run: python3 tests_legacy/run_static_checks.py

      - name: Goldens drift check (scipy parity, legacy)
        run: python3 scripts/gen_goldens.py --check

      - name: End-to-end numerical tests (legacy harness)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_numeric_tests.py

      - name: Validate SKILL.md examples (legacy)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_skill_checks.py

      - name: Validate mdBook examples
        env:
          CHELIS_BIN: chelis
        run: python3 scripts/validate_book_examples.py
