name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: nautilus
  # Audit-only mirror required by the shell contract. The detection step below
  # overwrites these values from reef.toml before runtime installation.
  CHELIS_TAG: v0.17.4
  CHELIS_VERSION: 0.17.4

jobs:
  build-reef-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect versions from reef.toml
        run: |
          set -euo pipefail
          CHELIS_VERSION=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          PACKAGE_VERSION=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml | head -1)
          if [ -z "$CHELIS_VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Failed to parse versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          echo "CHELIS_TAG=v$CHELIS_VERSION" >> "$GITHUB_ENV"
          echo "CHELIS_VERSION=$CHELIS_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION nautilus=$PACKAGE_VERSION"

      - name: Download chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download "${CHELIS_TAG}" \
            --repo Chelis-Lang/chelis \
            --pattern "chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            --dir /tmp/chelis-toolchain
          tar -xzf "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: test "$(chelis --version)" = "chelis ${CHELIS_VERSION}"

      - name: Install chelis-std into local registry
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      - name: Build reef assets
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef build

      - name: Seal and validate Reef release payloads
        run: |
          python3 scripts/check_release_artifacts.py --write-checksums
          chelis reef build
          python3 scripts/check_release_artifacts.py

      - name: Verify release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${PACKAGE_VERSION}"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.chb"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.sha256"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.tar.zst
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.chb
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A successful rerun deterministically rebuilds the same bytes, then
          # explicitly replaces the complete payload set.
          overwrite_files: true
