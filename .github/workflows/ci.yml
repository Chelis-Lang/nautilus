name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.1.18 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.1.18-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.1.18-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.1.18-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.1.18"

      - name: chelis check (all modules)
        run: |
          for f in src/*.ch; do
            echo "=== $f ==="
            out=$(chelis check "$f" 2>&1)
            echo "$out"
            echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"
          done

      - name: chelis reef build
        run: chelis reef build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eval startup benchmark
        env:
          CHELIS_BIN: chelis
        run: |
          python scripts/bench_eval_startup.py --trials 5
          grep -q "## Recommended upstream changes" docs/EVAL_STARTUP_FINDINGS.md

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      - name: Static API cross-checks
        run: python tests/run_static_checks.py

      - name: Extract stability surface
        run: python scripts/extract_stability.py --check

      - name: Goldens drift check (scipy parity)
        run: python scripts/gen_goldens.py --check

      - name: End-to-end numerical tests vs scipy goldens
        env:
          CHELIS_BIN: chelis
        run: python tests/run_numeric_tests.py

      - name: Validate SKILL.md examples
        env:
          CHELIS_BIN: chelis
        run: python tests/run_skill_checks.py

      - name: Validate mdBook examples
        env:
          CHELIS_BIN: chelis
        run: python scripts/validate_book_examples.py

      - name: Sanity-check chelis import gate (mutation test)
        run: |
          # Prove the apismoke gate actually has teeth by mutating one
          # import to a typo and asserting chelis check rejects it. If
          # this step ever passes silently, the import gate is broken.
          cp src/apismoke.ch src/apismoke.ch.bak
          sed -i 's/(erf, erfinv/(erf_TYPO_THAT_DOES_NOT_EXIST, erfinv/' src/apismoke.ch
          if chelis check src/apismoke.ch 2>&1 | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d.get('errors') or 'error' in (d.get('msg','') or '') else 1)" 2>/dev/null; then
            echo "chelis check correctly rejected typo'd import"
            mv src/apismoke.ch.bak src/apismoke.ch
          else
            # The check command may print 'error: ...' to stdout instead of JSON.
            output=$(chelis check src/apismoke.ch 2>&1 || true)
            mv src/apismoke.ch.bak src/apismoke.ch
            if echo "$output" | grep -q "does not export"; then
              echo "chelis check correctly rejected typo'd import"
              echo "$output"
            else
              echo "FAIL: chelis check accepted a typo'd import (gate is broken)"
              echo "$output"
              exit 1
            fi
          fi
