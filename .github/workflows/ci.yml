name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hard-rule-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI-author commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          RANGE="${BASE:+$BASE..}HEAD"
          if git log --format="%B" $RANGE | grep -iE "^Co-[Aa]uthored-[Bb]y:.*\b(claude|codex)\b"; then
            echo "FAIL: AI authorship trailer found in commit range $RANGE"
            exit 1
          fi
          echo "OK: no AI authorship trailers in $RANGE"

      # Guard 1: no Python under tests/ — the .ch test directory is the
      # Chelis-native gate. Any .py / .pyc / .pyi here is a backslide of
      # the cutover. .pyc/.pyi added per red-team round 3 MEDIUM-3 (a stale
      # __pycache__ would otherwise have slipped through bare `.py`).
      - name: Hard rule — no Python under tests/
        run: |
          hits=$(find tests -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyi' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Hard rule violation: Python file/artifact under tests/:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "OK: tests/ is Python-free (.py / .pyc / .pyi)"

      # Guard 2: no oracle-library imports (scipy/numpy/pandas/sympy/quantlib)
      # in any .py file under tests/ or src/. We restrict to .py because
      # Chelis source files (.ch) may legitimately mention scipy in a
      # comment such as "matches scipy.special.erf to 1e-7" — that's
      # documentation, not a dependency. The hard rule is "no Python code
      # under tests/, no oracle calls in Chelis code" — not "no mention of
      # the word scipy". numpy added per red-team round 3 MEDIUM-2 — it's
      # the most common numerical oracle and was missing from the
      # original guard list.
      - name: Hard rule — no oracle import in src/ or tests/ .py files
        run: |
          hits=$(grep -rEln '^[[:space:]]*(import|from)[[:space:]]+(scipy|numpy|pandas|sympy|quantlib)\b' \
                   --include='*.py' src tests 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Hard rule violation: oracle import in .py under src/ or tests/:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "OK: no oracle imports in src/ or tests/ .py files"

      # Guard 3: no oracle-callable sites inside Chelis source. We match the
      # dotted-callable pattern (e.g. `scipy.foo(...)` or `scipy.special.erf(...)`
      # or `scipy.stats.norm.pdf(...)`) rather than the bare word, so
      # descriptive comments still pass. The trailing `[\w.]*` segment after
      # the first dot must be allowed to contain its own dots so we catch
      # canonical scipy submodule paths (red-team CRITICAL-1, 2026-04-25).
      # Comment lines starting with `--` are stripped first so descriptive
      # text like `-- approximates scipy.special.erf to 1e-7` passes (red-team
      # round 3 MEDIUM-1). numpy added to oracle list (red-team MEDIUM-2).
      - name: Hard rule — no oracle callable in .ch sources
        run: |
          tmp=$(mktemp)
          # Strip both line-leading comments (`-- ...`) and inline trailing
          # comments before grepping. Doesn't handle string literals, but
          # Chelis test files don't put scipy.foo( inside a string.
          for f in $(find src tests -name '*.ch' 2>/dev/null); do
            sed -E 's/--.*$//' "$f" > "$tmp"
            if grep -EHn '\b(scipy|numpy|pandas|sympy|quantlib)\.[a-zA-Z_][a-zA-Z_0-9.]*[[:space:]]*\(' \
                 --label="$f" "$tmp"; then
              echo "Hard rule violation: oracle callable in $f (above)" >&2
              rm -f "$tmp"
              exit 1
            fi
          done
          rm -f "$tmp"
          echo "OK: no oracle callables in src/ or tests/ .ch source code"

  chelis-tests:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.4 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.4-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.2.4"

      # `chelis reef build` populates the local registry index with
      # chelis-std (and any other reef.toml dep) so subsequent
      # `chelis check / eval / test` invocations can resolve
      # `import Std.Test`. Without this step, every chelis call fails
      # with "package `chelis-std` version `0.1.0` missing from local
      # registry index". Ordered FIRST so `chelis check` below can
      # see the dep.
      - name: chelis reef build (populate registry)
        run: chelis reef build

      - name: chelis check (all modules)
        run: |
          for f in src/*.ch; do
            echo "=== $f ==="
            out=$(chelis check "$f" 2>&1)
            echo "$out"
            echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"
          done

      - name: Native Chelis tests
        run: chelis test --timeout 600 tests/

      - name: Sanity-check chelis import gate (mutation test)
        run: |
          # Prove the apismoke gate has teeth: mutate one import to a typo
          # and assert chelis check rejects it.
          cp src/apismoke.ch src/apismoke.ch.bak
          sed -i 's/(erf, erfinv/(erf_TYPO_THAT_DOES_NOT_EXIST, erfinv/' src/apismoke.ch
          if chelis check src/apismoke.ch 2>&1 | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d.get('errors') or 'error' in (d.get('msg','') or '') else 1)" 2>/dev/null; then
            echo "chelis check correctly rejected typo'd import"
            mv src/apismoke.ch.bak src/apismoke.ch
          else
            output=$(chelis check src/apismoke.ch 2>&1 || true)
            mv src/apismoke.ch.bak src/apismoke.ch
            if echo "$output" | grep -q "does not export"; then
              echo "chelis check correctly rejected typo'd import"
              echo "$output"
            else
              echo "FAIL: chelis check accepted a typo'd import (gate is broken)"
              echo "$output"
              exit 1
            fi
          fi

  scipy-parity:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.4 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.4-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Populate local registry so chelis eval can resolve chelis-std.
      - name: chelis reef build (populate registry)
        run: chelis reef build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      - name: scipy parity (Chelis output vs scipy.* references)
        run: python3 -u parity/run_parity.py --strict

  legacy-harness:
    # Dual-run safety net: keeps the original Python harness alive for one
    # week of green CI before being deleted in Phase 3 of the cutover.
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.4 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.4-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Populate local registry so SKILL.md / mdBook example chelis-checks
      # can resolve chelis-std (the legacy run_skill_checks.py and
      # validate_book_examples.py invoke chelis check on each fenced block).
      - name: chelis reef build (populate registry)
        run: chelis reef build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      - name: Static API cross-checks (legacy)
        run: python3 tests_legacy/run_static_checks.py

      - name: Goldens drift check (scipy parity, legacy)
        run: python3 scripts/gen_goldens.py --check

      - name: End-to-end numerical tests (legacy harness)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_numeric_tests.py

      - name: Validate SKILL.md examples (legacy)
        env:
          CHELIS_BIN: chelis
        run: python3 tests_legacy/run_skill_checks.py

      - name: Validate mdBook examples
        env:
          CHELIS_BIN: chelis
        run: python3 scripts/validate_book_examples.py
