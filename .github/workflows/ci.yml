name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Audit-only mirror required by the shell contract. The installer resolves
  # its runtime tag and version directly from the exact pin in reef.toml; the
  # fail-fast guard and `conform audit` reject drift in this pair.
  CHELIS_TAG: v0.18.11
  CHELIS_VERSION: 0.18.11

jobs:
  pin-consistency-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Python automation contracts
        run: python3 -m unittest discover -v -s scripts -p 'test_*.py'

      - name: Assert workflow Chelis audit mirrors match reef.toml
        run: python3 scripts/check_workflow_pins.py

      - name: Install reef-pinned Chelis
        uses: ./.github/actions/install-chelis
        with:
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}

      - name: Audit shell conformance and workflow pins
        run: chelis reef conform audit --explain

      - name: Enforce the pin-bump contract
        run: chelis reef conform bump-check --base origin/main

  hard-rule-guard:
    # Every numerical/documentation job depends on this job, so a failed pin
    # audit or bump-check prevents the rest of CI from reporting green.
    needs: pin-consistency-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test secret scan contract
        run: python3 -m unittest discover -v -s .github/scripts -p test_secret_scan.py

      - name: Reject AI-author commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          RANGE="${BASE:+$BASE..}HEAD"
          if git log --format="%B" $RANGE | grep -iE "^Co-[Aa]uthored-[Bb]y:.*\b(claude|codex)\b"; then
            echo "FAIL: AI authorship trailer found in commit range $RANGE"
            exit 1
          fi
          echo "OK: no AI authorship trailers in $RANGE"

      # Guard 1: no Python under tests/. The native suite is written in
      # Chelis; external oracles live only in parity/.
      - name: Hard rule — no Python under tests/
        run: |
          hits=$(find tests -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyi' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Hard rule violation: Python file/artifact under tests/:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "OK: tests/ is Python-free (.py / .pyc / .pyi)"

      # Guard 2: external-oracle imports are confined to parity/, and no
      # tracked or untracked Chelis source may call an oracle library.
      - name: Hard rule — external oracle isolation
        run: python3 scripts/check_oracle_isolation.py

      # Guard 3: at least one tests/*.ch exists, so an empty suite cannot
      # silently report 0 failures.
      - name: Hard rule — tests/ contains at least one .ch file
        run: |
          n=$(find tests -maxdepth 1 -name '*.ch' -type f | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "Hard rule violation: tests/*.ch is empty" >&2
            exit 1
          fi
          echo "OK: tests/ contains $n .ch files"

  # Single-runner static gates: chelis check + reef build. These don't
  # parallelize meaningfully (chelis check is ~10s for the whole src tree)
  # so they share a runner with the apismoke mutation test.
  chelis-check:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      # chelis reef build type-checks the whole package: any src file that
      # fails type-checking or has unresolved imports fails the build. The
      # exhaustive per-file `chelis check` sweep costs roughly 25s per file on
      # GitHub runners, so it runs in nightly.yml instead.
      - name: chelis reef build
        run: chelis reef build

      - name: Seal and validate Reef release payloads
        run: |
          python3 scripts/check_release_artifacts.py --write-checksums
          chelis reef build
          python3 scripts/check_release_artifacts.py

      # One chelis check as a smoke test that the binary works and still
      # reports score=1. The file rotates by day of year so every module is
      # covered over time.
      - name: chelis check smoke (one file)
        run: |
          files=(src/*.ch)
          # Pick a file by day of year so coverage rotates.
          idx=$(( $(date -u +%j) % ${#files[@]} ))
          f="${files[$idx]}"
          echo "smoke check: $f"
          out=$(chelis check "$f")
          echo "$out"
          echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"

      - name: Sanity-check chelis import gate (mutation test)
        run: |
          # Prove the apismoke gate has teeth: mutate one import to a typo
          # and assert chelis check rejects it.
          cp src/apismoke.ch src/apismoke.ch.bak
          # Mutate the first import in `Nautilus.Special (erf, erfc, ...)` to a
          # name that cannot exist. `(erf,` is unique to the import line in
          # this file (no body call site has that exact prefix). Robust
          # against new exports being appended; if someone reorders so `erf`
          # is no longer the first import, the sed becomes a no-op and this
          # gate fails loudly — that's intended (forces an explicit review
          # rather than a silent gate-bypass).
          sed -i 's/(erf,/(erf_TYPO_THAT_DOES_NOT_EXIST,/' src/apismoke.ch
          if chelis check src/apismoke.ch 2>&1 | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d.get('errors') or 'error' in (d.get('msg','') or '') else 1)" 2>/dev/null; then
            echo "chelis check correctly rejected typo'd import"
            mv src/apismoke.ch.bak src/apismoke.ch
          else
            output=$(chelis check src/apismoke.ch 2>&1 || true)
            mv src/apismoke.ch.bak src/apismoke.ch
            if echo "$output" | grep -q "does not export"; then
              echo "chelis check correctly rejected typo'd import"
              echo "$output"
            else
              echo "FAIL: chelis check accepted a typo'd import (gate is broken)"
              echo "$output"
              exit 1
            fi
          fi

  chelis-tests:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      - name: chelis test (node-local parallel)
        # --suite-timeout is raised above its 600s default because this tensor
        # and Monte Carlo suite takes roughly 800-940s on GitHub's Linux
        # runners. That is the suite's own weight, not a compiler regression.
        # Sharding tests/ across a CI matrix would let each shard fit the
        # default (nautilus#78).
        run: chelis test tests/ --timeout 600 --suite-timeout 2400 --jobs auto

      # Shell contract §6: every case must fail with the diagnostic substring
      # pinned on line 1 of its paired .expect sidecar.
      - name: chelis test (negative contracts)
        run: chelis test tests_neg/ --expect neg

      # Shell contract §5: blockers must keep failing with their pinned
      # diagnostic. A pass is FIX-DETECTED and fails until de-narrowed.
      - name: chelis test (upstream-blocker probes)
        if: ${{ hashFiles('tests_blocked/**/*.ch') != '' }}
        run: chelis test tests_blocked/ --expect blocked

  scipy-parity:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install locked parity environment
        run: uv sync --project parity --frozen

      - name: SciPy parity (validate reviewed goldens; never regenerate in CI)
        run: uv run --project parity --frozen python parity/run_parity.py --strict

  # Mac proof-of-life: the Nautilus reef package builds under the
  # Darwin chelis toolchain. NOT a duplicate test suite — the full
  # tests/ run lives on Linux. This job exists so a Darwin chelis
  # regression that breaks Nautilus surfaces in CI instead of in a
  # Mac user's bug report. See docs/releases.md for the artifact-
  # platform policy.
  mac-smoke:
    runs-on: macos-latest
    # Demoted off the per-PR path: macOS minutes bill ~10x Linux. This is a
    # proof-of-life smoke, not a coverage gate, so it runs on push-to-main and
    # workflow_dispatch but not on every PR iteration.
    if: ${{ github.event_name != 'pull_request' }}
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          platform: darwin-arm64
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/install_chelis_std.py

      - name: chelis reef build (proof-of-life)
        run: chelis reef build

      - name: Seal and validate Darwin-built Reef payloads
        run: |
          python3 scripts/check_release_artifacts.py --write-checksums
          chelis reef build
          python3 scripts/check_release_artifacts.py
