name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHELIS_TAG: v0.12.0
  CHELIS_VERSION: 0.12.0

jobs:
  hard-rule-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI-author commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          RANGE="${BASE:+$BASE..}HEAD"
          if git log --format="%B" $RANGE | grep -iE "^Co-[Aa]uthored-[Bb]y:.*\b(claude|codex)\b"; then
            echo "FAIL: AI authorship trailer found in commit range $RANGE"
            exit 1
          fi
          echo "OK: no AI authorship trailers in $RANGE"

      # Guard 1: no Python under tests/ — the .ch test directory is the
      # Chelis-native gate. Any .py / .pyc / .pyi here is a backslide of
      # the cutover.
      - name: Hard rule — no Python under tests/
        run: |
          hits=$(find tests -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyi' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Hard rule violation: Python file/artifact under tests/:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "OK: tests/ is Python-free (.py / .pyc / .pyi)"

      # Guard 2: no oracle-library imports (scipy/numpy/pandas/sympy/quantlib)
      # in any .py file under tests/ or src/.
      - name: Hard rule — no oracle import in src/ or tests/ .py files
        run: |
          hits=$(grep -rEln '^[[:space:]]*(import|from)[[:space:]]+(scipy|numpy|pandas|sympy|quantlib)\b' \
                   --include='*.py' src tests 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Hard rule violation: oracle import in .py under src/ or tests/:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "OK: no oracle imports in src/ or tests/ .py files"

      # Guard 3: no oracle-callable sites inside Chelis source.
      - name: Hard rule — no oracle callable in .ch sources
        run: |
          tmp=$(mktemp)
          for f in $(find src tests -name '*.ch' 2>/dev/null); do
            sed -E 's/--.*$//' "$f" > "$tmp"
            if grep -EHn '\b(scipy|numpy|pandas|sympy|quantlib)\.[a-zA-Z_][a-zA-Z_0-9.]*[[:space:]]*\(' \
                 --label="$f" "$tmp"; then
              echo "Hard rule violation: oracle callable in $f (above)" >&2
              rm -f "$tmp"
              exit 1
            fi
          done
          rm -f "$tmp"
          echo "OK: no oracle callables in src/ or tests/ .ch source code"

      # Guard 4: at least one tests/*.ch exists. The chelis-tests matrix
      # used to be generated dynamically from `find tests -name '*.ch'`;
      # keep this guard after the node-local `chelis test --jobs auto`
      # cutover so an empty suite cannot silently report 0 failures.
      - name: Hard rule — tests/ contains at least one .ch file
        run: |
          n=$(find tests -maxdepth 1 -name '*.ch' -type f | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "Hard rule violation: tests/*.ch is empty" >&2
            exit 1
          fi
          echo "OK: tests/ contains $n .ch files"

  # Single-runner static gates: chelis check + reef build. These don't
  # parallelize meaningfully (chelis check is ~10s for the whole src tree)
  # so they share a runner with the apismoke mutation test.
  chelis-check:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std-${{ env.CHELIS_TAG }}

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          CHELIS_TAG: ${{ env.CHELIS_TAG }}
        run: python3 scripts/install_chelis_std.py

      # chelis reef build does whole-package type checking — if any src
      # file fails type-check or has unresolved imports, the build fails.
      # The per-file `chelis check` loop with score=1 enforcement that
      # used to live here was costing 8m22s in CI (~25s per file × 21 —
      # a 1000× slowdown vs the 21ms-per-file local probe; cause is in
      # chelis itself, not our setup). Moved to nightly.yml where the
      # cost is acceptable.
      - name: chelis reef build
        run: chelis reef build

      # One chelis check as a smoke that the binary works + the score=1
      # field is still emitted. Rotates through the alphabet by day to
      # catch a slow drift if score-1 ever stops being universal.
      - name: chelis check smoke (one file)
        run: |
          files=(src/*.ch)
          # Pick a file based on day-of-year mod 21 so coverage rotates.
          idx=$(( $(date -u +%j) % ${#files[@]} ))
          f="${files[$idx]}"
          echo "smoke check: $f"
          out=$(chelis check "$f")
          echo "$out"
          echo "$out" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d['score']==1 and not d['errors'] else 1)"

      - name: Sanity-check chelis import gate (mutation test)
        run: |
          # Prove the apismoke gate has teeth: mutate one import to a typo
          # and assert chelis check rejects it.
          cp src/apismoke.ch src/apismoke.ch.bak
          # Mutate the first import in `Nautilus.Special (erf, erfc, ...)` to a
          # name that cannot exist. `(erf,` is unique to the import line in
          # this file (no body call site has that exact prefix). Robust
          # against new exports being appended; if someone reorders so `erf`
          # is no longer the first import, the sed becomes a no-op and this
          # gate fails loudly — that's intended (forces an explicit review
          # rather than a silent gate-bypass).
          sed -i 's/(erf,/(erf_TYPO_THAT_DOES_NOT_EXIST,/' src/apismoke.ch
          if chelis check src/apismoke.ch 2>&1 | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); sys.exit(0 if d.get('errors') or 'error' in (d.get('msg','') or '') else 1)" 2>/dev/null; then
            echo "chelis check correctly rejected typo'd import"
            mv src/apismoke.ch.bak src/apismoke.ch
          else
            output=$(chelis check src/apismoke.ch 2>&1 || true)
            mv src/apismoke.ch.bak src/apismoke.ch
            if echo "$output" | grep -q "does not export"; then
              echo "chelis check correctly rejected typo'd import"
              echo "$output"
            else
              echo "FAIL: chelis check accepted a typo'd import (gate is broken)"
              echo "$output"
              exit 1
            fi
          fi

  chelis-tests:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std-${{ env.CHELIS_TAG }}

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          CHELIS_TAG: ${{ env.CHELIS_TAG }}
        run: python3 scripts/install_chelis_std.py

      - name: chelis test (node-local parallel)
        run: chelis test tests/ --timeout 600 --jobs auto

  scipy-parity:
    runs-on: ubuntu-latest
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std-${{ env.CHELIS_TAG }}

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          CHELIS_TAG: ${{ env.CHELIS_TAG }}
        run: python3 scripts/install_chelis_std.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy + numpy
        run: pip install --no-cache-dir 'numpy>=1.26' 'scipy>=1.14'

      - name: scipy parity (Chelis output vs scipy.* references)
        run: python3 -u parity/run_parity.py --strict

  # Mac proof-of-life: the Nautilus reef package builds under the
  # Darwin chelis toolchain. NOT a duplicate test suite — the full
  # tests/ run lives on Linux. This job exists so a Darwin chelis
  # regression that breaks Nautilus surfaces in CI instead of in a
  # Mac user's bug report. See docs/releases.md for the artifact-
  # platform policy.
  mac-smoke:
    runs-on: macos-latest
    # Demoted off the per-PR path: macOS minutes bill ~10x Linux. This is a
    # proof-of-life smoke, not a coverage gate, so it runs on push-to-main and
    # workflow_dispatch but not on every PR iteration.
    if: ${{ github.event_name != 'pull_request' }}
    needs: hard-rule-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          platform: darwin-arm64
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: std-${{ env.CHELIS_TAG }}

      - name: Install chelis-std into local registry
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          CHELIS_TAG: ${{ env.CHELIS_TAG }}
        run: python3 scripts/install_chelis_std.py

      - name: chelis reef build (proof-of-life)
        run: chelis reef build

  # legacy-harness moved to .github/workflows/nightly.yml — runs on a
  # schedule, not on every PR. It's the dual-run safety net during the
  # cutover window; once tests/*.ch reaches 100% coverage parity with
  # the legacy assertions, the nightly job is removed (Phase 4 of the
  # cutover plan).
