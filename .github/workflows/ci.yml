name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(toolchain-auth): the default GITHUB_TOKEN is scoped to this repo
      # only, so `gh release download` against the sibling private
      # Chelis-Lang/chelis repo will fail until one of the following is in
      # place: an org-level PAT stored as secret CHELIS_RELEASE_TOKEN, public
      # release assets, or a GitHub Packages artifact with org-wide read.
      # See README "Known limitation — CI auth".
      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.1.2 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.1.2-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.1.2-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.1.2-linux-x86_64" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.1.2"

      - name: chelis check
        run: chelis check src/core.ch
