name: Install Chelis toolchain
description: >-
  Resolve the exact compiler pin from reef.toml, restore (or download) that
  Chelis toolchain tarball from a per-tag actions/cache, put its bin/ on PATH,
  verify the version. Chelis bundles its standard library in the toolchain.
  Replaces the inline `gh release download` + `tar` blocks duplicated across
  CI jobs so each leg stops re-downloading the toolchain on every run.

inputs:
  platform:
    description: >-
      Toolchain platform slug (linux-x86_64-glibc2.31 by default, or
      darwin-arm64 for the macOS smoke lane).
    required: false
    default: linux-x86_64-glibc2.31
  gh-token:
    description: Token with contents:read on Chelis-Lang/chelis (for the cache-miss download).
    required: true

outputs:
  chelis-tag:
    description: Chelis release tag resolved from reef.toml.
    value: ${{ steps.reef-pin.outputs.chelis-tag }}
  chelis-version:
    description: Bare Chelis version resolved from reef.toml.
    value: ${{ steps.reef-pin.outputs.chelis-version }}

runs:
  using: composite
  steps:
    - name: Resolve exact Chelis pin from reef.toml
      id: reef-pin
      shell: bash
      run: python3 scripts/reef_pin.py >> "$GITHUB_OUTPUT"

    - name: Restore cached chelis toolchain
      id: toolchain-cache
      uses: actions/cache@v4
      with:
        path: /tmp/chelis-toolchain
        key: chelis-toolchain-sha256-v1-${{ steps.reef-pin.outputs.chelis-tag }}-${{ inputs.platform }}

    - name: Download chelis toolchain (cache miss)
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -euo pipefail
        rm -rf /tmp/chelis-toolchain
        mkdir -p /tmp/chelis-toolchain
        asset="chelis-${{ steps.reef-pin.outputs.chelis-tag }}-${{ inputs.platform }}.tar.gz"
        gh release download "${{ steps.reef-pin.outputs.chelis-tag }}" \
          --repo Chelis-Lang/chelis \
          --pattern "$asset" \
          --pattern "$asset.sha256" \
          --dir /tmp/chelis-toolchain
        (
          cd /tmp/chelis-toolchain
          if [ "${{ inputs.platform }}" = "darwin-arm64" ]; then
            shasum -a 256 -c "$asset.sha256"
          else
            sha256sum -c "$asset.sha256"
          fi
        )
        tar -xzf "/tmp/chelis-toolchain/$asset" \
          -C /tmp/chelis-toolchain

    - name: Put chelis on PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "/tmp/chelis-toolchain/chelis-${{ steps.reef-pin.outputs.chelis-tag }}-${{ inputs.platform }}/bin" >> "$GITHUB_PATH"

    - name: Verify toolchain version
      shell: bash
      run: test "$(chelis --version)" = "chelis ${{ steps.reef-pin.outputs.chelis-version }}"
